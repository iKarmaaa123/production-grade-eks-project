name: CDK Diff Workflow
on:
  push:
    paths:
      - "infra/bin/**"
      - "infra/lib/**"

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  cdk_diff:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infra

    steps:
    - name: Checking out repository
      uses: actions/checkout@v6

    - name: Setting up node
      uses: actions/setup-node@v6
      with:
        node-version: "25"

    - name: Installing dependencies for cdk project
      run: npm install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::648767092427:role/IamRoleForGitHubActionsRunner
        aws-region: ${{ env.AWS_REGION }}

    - name: Installing CDK
      run: npm install -g aws-cdk

    - name: Running CDK Synth
      run: npx cdk synth --all

    - name: Running CDK Diff
      run: npx cdk diff --all

    - name: Running Checkov scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ./infra/cdk.out
        framework: cloudformation
        output_format: cli
        quiet: true
        soft_fail: true 