name: CDK Deploy Workflow
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cdk_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checking out repository
      uses: actions/checkout@v6

    - name: Setting up node
      uses: actions/setup-node@v6
      with:
        node-version: "25"

    - name: Installing dependencies for cdk project
      run: npm install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::648767092427:role/IamRoleForGitHubActionsRunner
        aws-region: us-east-1

    - name: Installing CDK
      run: npm install -g aws-cdk

    - name: Running CDK Deploy
      run: npx cdk deploy --all --require-approval never

    - name: Setting up kubectl for GitHub Actions runner
      uses: alexellis/arkade-get@master
      with:
        kubectl: latest
    
    - name: Accessing EKS cluster
      run: aws eks update-kubeconfig --name eks-project-cluster --region us-east-1 --role-arn arn:aws:iam::648767092427:role/EksClusterMasterRole

    - name: Deploying ClusterIssuer
      run: kubectl apply -f k8s-manifest-files/cert-manager/issuer.yaml

    - name: Deploying application for argocd
      run: kubectl apply -f k8s-manifest-files/argocd/argocd.yaml