name: CDK Deploy Workflow
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  cdk_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
    - name: Checking out repository
      uses: actions/checkout@v6

    - name: Setting up node
      uses: actions/setup-node@v6
      with:
        node-version: "25"

    - name: Installing dependencies for cdk project
      run: npm install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::648767092427:role/IamRoleForGitHubActionsRunner
        aws-region: ${{ env.AWS_REGION }}

    - name: Installing CDK
      run: npm install -g aws-cdk

    - name: Deploying EKS Cluster
      run: npx cdk deploy ClusterStack --require-approval never

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure kube config
      run: aws eks update-kubeconfig --name eks-project-cluster --region ${{ env.AWS_REGION }}

    - name: Creating cluster issuer
      run: kubectl apply -f k8s-manifest-file/cert-manager/issuer.yaml
      working-directory: ./k8s-manifest

    - name: Deploying ArgoCD config
      run: kubectl apply -f k8s-manifest-file/argocd/argocd.yaml
      working-directory: ./k8s-manifest

    - name: Deploying Helm charts
      run: npx cdk deploy HelmStack --require-approval never
